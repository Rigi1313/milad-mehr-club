<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0f2a">
  <title>باشگاه میلاد مهر - آفلاین</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0f2a;
      color: #fff;
      font-family: Tahoma, Arial, sans-serif;
      padding: 24px;
    }

    .box {
      width: min(420px, 100%);
      text-align: center;
      background: #111936;
      border-radius: 24px;
      padding: 36px 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }

    img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 24px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    p {
      color: #cbd2e8;
      line-height: 1.9;
      margin: 0 0 24px;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 12px 24px;
      background: #fff;
      color: #0a0f2a;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <main class="box">
    <img src="./icons/icon-192.png" alt="لوگوی باشگاه میلاد مهر">

    <h1>باشگاه میلاد مهر</h1>

    <p>
      در حال حاضر اتصال اینترنت برقرار نیست.
      لطفاً اتصال اینترنت را بررسی کنید و دوباره تلاش کنید.
    </p>

    <button onclick="location.reload()">
      تلاش مجدد
    </button>
  </main>
</body>
  </html>
